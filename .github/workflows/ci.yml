name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# Read-only token: CI never pushes, comments or publishes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.13.0", "24"]
    steps:
      - name: Keep LF line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Lint self-test
        run: node scripts/lint.mjs --self-test
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Built CLI loads SQLite without an ExperimentalWarning
        shell: bash
        run: |
          node --input-type=module -e "
            process.argv = [process.argv[0], 'dist/bin.js', '--version'];
            await import('./dist/bin.js');
            await import('./dist/index/db.js');
          " 2> stderr.txt || true
          cat stderr.txt
          if grep -q ExperimentalWarning stderr.txt; then echo 'dist/bin.js let the SQLite ExperimentalWarning through'; exit 1; fi

  # The only supported installs are from GitHub, so prove they work: a git install must build
  # dist/ through "prepare", and the release tarball must carry the CLI.
  install:
    name: install from GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: npx from a git URL builds and runs the CLI
        shell: bash
        run: |
          want="$(node -p "require('./package.json').version")"
          cd "$RUNNER_TEMP"
          got="$(npx --yes "git+file://$GITHUB_WORKSPACE" --version)"
          echo "installed from git: $got"
          test "$got" = "$want"
      - name: The release tarball ships the CLI and its build info
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm pkg delete scripts.prepare
          npm pack --ignore-scripts --dry-run --json > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map((f) => f.path);
            for (const need of ['dist/bin.js', 'dist/build-info.json', 'assets/workflow.yml.tmpl']) {
              if (!files.includes(need)) { console.error('missing from the tarball: ' + need); process.exit(1); }
            }
            console.log(files.length + ' files, CLI included');
          "
