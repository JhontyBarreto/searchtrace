name: release

# Push a tag like v0.1.0 and this builds, tests and packs that exact commit, then attaches the
# tarball and its SHA-256 to the GitHub release. The tarball is the permanent install:
#   npm install -g https://github.com/JhontyBarreto/searchtrace/releases/download/v0.1.0/searchtrace-0.1.0.tgz
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install, lint, test and build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Pack
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::The tag $TAG does not match package.json's version $version."
            exit 1
          fi
          # "prepare" builds a git install; the tarball is already built, so drop it to keep npm quiet.
          npm pkg delete scripts.prepare
          npm pack --ignore-scripts
          sha256sum "searchtrace-$version.tgz" > SHA256SUMS
          cat SHA256SUMS
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/searchtrace-$version.tgz"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "searchtrace-$version.tgz" SHA256SUMS --clobber
          else
            gh release create "$TAG" "searchtrace-$version.tgz" SHA256SUMS --verify-tag --title "searchtrace $version" \
              --notes "Install: npm install -g $url (Node 22.13 or newer). See CHANGELOG.md for what changed."
          fi
